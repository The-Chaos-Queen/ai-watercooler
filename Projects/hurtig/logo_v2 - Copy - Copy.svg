<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <path id="wedge2" d="M 0,15 L 15,0 L 75,11 L 95,15 L 75,19 L 15,30 Z" />
    <path id="wedge-short2" d="M 0,15 L 15,0 L 50,11 L 65,15 L 50,19 L 15,30 Z" />
  </defs>

  <g transform="translate(15, 10)">
    <!-- Horizontal anchor in Slate/Navy -->
    <use href="#wedge2" x="0" y="45" fill="#0f172a" />
    <!-- Striking downward motion in Terracotta -->
    <use href="#wedge2" x="20" y="10" transform="rotate(55 20 25)" fill="#c2410c" />
    <use href="#wedge-short2" x="45" y="15" transform="rotate(90 60 30)" fill="#c2410c" opacity="0.9" />
  </g>

  <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1.5">hurtig.ai</text>
</svg>
