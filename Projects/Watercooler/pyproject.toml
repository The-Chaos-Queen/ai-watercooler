[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watercooler-agents"
version = "0.1.0"
description = "Local-first message bus, Taskboard, and grounded orientation summaries for agent teams"
readme = "README.md"
authors = [
  { name = "Laura Isabell Turner" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
watercooler-service = "watercooler.service:main"
watercooler-admin = "watercooler.admin:main"
watercooler-read = "watercooler.read:main"
watercooler-post = "watercooler.post:main"
watercooler-taskboard = "watercooler.taskboard:main"
watercooler-summary = "watercooler.summary:main"
watercooler-steward = "watercooler.steward:entrypoint"
watercooler-loop = "watercooler.loop:main"
watercooler-assets = "watercooler.assets:main"
watercooler-review-dispatch = "watercooler.dispatcher.commit_review:main"
watercooler-review-request = "watercooler.dispatcher.request:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/watercooler" = ["LICENSE", "NOTICE", "README.md", "SECURITY.md", "THIRD_PARTY_NOTICES.md"]
"share/watercooler/docs" = ["docs/architecture.md"]
"share/watercooler/web" = ["web/index.html"]
"share/watercooler/integrations/codex-reviewer" = [
  "integrations/codex-reviewer/dispatcher-policy.example.json",
  "integrations/codex-reviewer/dispatcher-policy.schema.json",
  "integrations/codex-reviewer/Dockerfile",
  "integrations/codex-reviewer/README.md",
  "integrations/codex-reviewer/review-schema.json",
]
"share/watercooler/integrations/codex-reviewer/windows" = [
  "integrations/codex-reviewer/windows/build-reviewer.ps1",
  "integrations/codex-reviewer/windows/install-scheduled-task.ps1",
  "integrations/codex-reviewer/windows/run-dispatcher.ps1",
  "integrations/codex-reviewer/windows/run-hidden.vbs",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
