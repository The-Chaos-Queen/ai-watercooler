# Nginx server block for MCP Watercooler proxy
# Install on Hetzner at /etc/nginx/sites-available/mcp-watercooler
# Then: ln -s /etc/nginx/sites-available/mcp-watercooler /etc/nginx/sites-enabled/
#
# Prerequisites:
#   1. DNS A record: mcp.hurtig.ai -> <hetzner-ip>
#   2. TLS cert: certbot --nginx -d mcp.hurtig.ai
#      (or expand existing: certbot --expand -d hurtig.ai -d www.hurtig.ai -d mcp.hurtig.ai)
#   3. SSH tunnel running: systemctl status mcp-tunnel (on NUC)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.hurtig.ai;

    ssl_certificate /etc/letsencrypt/live/hurtig.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hurtig.ai/privkey.pem;

    # MCP streamable-http endpoint
    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Critical for MCP streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-lived streaming connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check (no auth required)
    location /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_http_version 1.1;
    }

    # Block everything else
    location / {
        return 404;
    }
}

# HTTP redirect
server {
    listen 80;
    listen [::]:80;
    server_name mcp.hurtig.ai;
    return 301 https://$host$request_uri;
}
