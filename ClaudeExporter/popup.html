<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: sans-serif;
      background-color: #f3f3f3;
    }

    h2 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
      border-bottom: 2px solid #6b4fbb;
      padding-bottom: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #6b4fbb;
      /* Claude-ish purple */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #5a3ea8;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <h2 id="title">AI Chat Exporter</h2>
  <button id="exportBtn">Export Chat</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>

</html>
